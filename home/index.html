<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <!-- Le pagine vivono dentro la cornice (index.html), che tiene audio e schermo intero
       tra una pagina e l'altra: aperte da sole, ci rientrano con lo stesso indirizzo. -->
  <script>if (window.top === window) location.replace('/?go=' + encodeURIComponent(location.pathname + location.search + location.hash));</script>

  <!-- Una pagina vecchia rimasta nella cache può chiedere file che con l'aggiornamento non ci sono
       più (pagina senza stile): in quel caso si ricarica una volta da capo. -->
  <script>addEventListener('error', function (e) { var t = e.target; if (t && (t.tagName === 'LINK' || t.tagName === 'SCRIPT')) { try { if (sessionStorage.getItem('stale') !== location.pathname) { sessionStorage.setItem('stale', location.pathname); location.reload(); } } catch (x) {} } }, true);</script>

  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Learn With Love</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦄</text></svg>" />
  <style>
    main { max-width: 720px; margin: 0 auto; padding: 32px 16px; text-align: center; }
    main > svg { filter: drop-shadow(0 0 24px rgba(255, 201, 60, .55)); animation: idle 3.6s ease-in-out infinite; }
    /* Titolo a lettere d'oro con un riflesso che scorre */
    h1 {
      font-size: clamp(2.8rem, 10vw, 4.6rem); margin: 8px 0 0; line-height: 1;
      background: linear-gradient(100deg, #fff6c7 20%, #ffffff 40%, #ffc93c 50%, #fff6c7 60%) 0 0 / 250% 100%;
      -webkit-background-clip: text; background-clip: text; color: transparent !important;
      filter: drop-shadow(0 4px 0 rgba(0, 0, 0, .25)) drop-shadow(0 0 22px rgba(255, 201, 60, .5));
      animation: rise .7s both, gold 4s linear infinite;
    }
    @keyframes gold { to { background-position: -250% 0; } }
    p.sub { font-size: 1.25rem; margin: 6px 0 20px; }
    /* Chi gioca: scelto qui per tutti i giochi */
    .who { display: inline-flex; align-items: center; gap: 12px; margin: 0 auto 24px; padding: 8px 10px 8px 8px; border-radius: 999px;
      background: var(--card); color: var(--ink); box-shadow: var(--shadow); font-size: 1.15rem; animation: rise .6s .1s both; }
    .who:empty { display: none; }
    .who .big-btn { font-size: 1.5rem; padding: 8px 32px; }
    .who { flex-wrap: wrap; justify-content: center; max-width: 100%; }
    .who:has(.big-btn) { background: none; box-shadow: none; padding: 0; }
    .chooser { position: fixed; inset: 0; z-index: 20; background: rgba(20, 12, 50, .55); display: grid; place-items: center; padding: 16px; }
    .chooser > div { background: var(--bg); color: var(--ink); border-radius: 32px; padding: 20px 16px; width: min(100%, 560px); max-height: 92dvh; overflow: auto; }
    .chooser h2 { margin: 0 0 12px; }
    /* I giochi come icone di app: piccoli, tanti per riga (ne arriveranno altri). */
    .apps { display: grid; grid-template-columns: repeat(auto-fill, 100px); justify-content: center; gap: 18px 12px; max-width: 560px; margin: 0 auto; }
    .app { display: flex; flex-direction: column; align-items: center; gap: 6px; text-decoration: none; color: #fff;
      transition: transform .2s cubic-bezier(.2, .9, .3, 1.3); }
    .app svg { width: 76px; height: 76px; filter: drop-shadow(0 8px 14px rgba(0, 0, 0, .35)); animation: bob 2.8s ease-in-out infinite; }
    .app:nth-child(2) svg { animation-delay: -1.3s; }
    .app:hover, .app:focus-visible { transform: translateY(-4px) scale(1.06); }
    .app:active { transform: scale(.94); }
    .app h2 { margin: 0; font-size: 1.05rem; text-shadow: 0 2px 8px rgba(0, 0, 0, .4); }
    .app span { display: none; }
    /* Tutto in uno schermo anche sul telefono: unicorno e titolo si adattano all'altezza. */
    main { padding: clamp(10px, 3dvh, 32px) 16px; }
    main > svg { width: clamp(70px, 14dvh, 130px); height: auto; }
    h1 { font-size: clamp(2.2rem, min(10vw, 7dvh), 4.6rem); }
    p.sub { font-size: clamp(1rem, 2.4dvh, 1.25rem); margin-bottom: clamp(10px, 2.4dvh, 20px); }
    .who { margin-bottom: clamp(14px, 3dvh, 24px); }
    /* Pagina a schermo intero, come un gioco: niente scorrimento; il contenuto sta in mezzo. */
    html, body { height: 100%; overflow: hidden; }
    body { display: flex; flex-direction: column; height: 100dvh; padding: env(safe-area-inset-top) 0 0; }
    body > main { flex: 1 1 auto; min-height: 0; width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    body.staged .app { background: none !important; box-shadow: none !important; }
    .apps { width: 100%; }
    @media (max-width: 480px) {
      .who { gap: 6px; font-size: 1rem; padding: 6px 8px 6px 6px; flex-wrap: nowrap; }
      .who svg { width: 40px; height: 40px; }
      .who .pill-btn { padding: 6px 10px; font-size: .95rem; }
    }
    .site-share { position: fixed; top: max(10px, env(safe-area-inset-top)); right: 58px; z-index: 5; width: 40px; height: 40px; border-radius: 12px;
      background: rgba(255, 255, 255, .14); color: #fff; display: grid; place-items: center; box-shadow: none; }
    .site-share svg { width: 20px; height: 20px; }
    #full-btn[hidden] ~ .site-share, body:not(:has(#full-btn:not([hidden]))) .site-share { right: 10px; }
    #full-btn { position: fixed; top: max(10px, env(safe-area-inset-top)); right: 10px; z-index: 5; width: 40px; height: 40px; border-radius: 12px;
      background: rgba(255, 255, 255, .14); color: #fff; font-size: 1.2rem; display: grid; place-items: center; }
  </style>
