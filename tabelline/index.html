<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <!-- Le pagine vivono dentro la cornice (index.html), che tiene audio e schermo intero
       tra una pagina e l'altra: aperte da sole, ci rientrano con lo stesso indirizzo. -->
  <script>if (window.top === window) location.replace('/?go=' + encodeURIComponent(location.pathname + location.search + location.hash));</script>

  <!-- Una pagina vecchia rimasta nella cache può chiedere file che con l'aggiornamento non ci sono
       più (pagina senza stile): in quel caso si ricarica una volta da capo. -->
  <script>addEventListener('error', function (e) { var t = e.target; if (t && (t.tagName === 'LINK' || t.tagName === 'SCRIPT')) { try { if (sessionStorage.getItem('stale') !== location.pathname) { sessionStorage.setItem('stale', location.pathname); location.reload(); } } catch (x) {} } }, true);</script>

  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />

  <link rel="apple-touch-icon" href="/icon-180.png" />

</head>
<body class="fit">
  <svg class="bg-deco" viewBox="0 0 400 800" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <circle cx="30" cy="80" r="40" fill="#ffc93c" opacity=".25" />
    <circle cx="380" cy="200" r="60" fill="#5fa8ff" opacity=".18" />
    <circle cx="60" cy="620" r="70" fill="#3ec5a3" opacity=".18" />
    <circle cx="360" cy="740" r="45" fill="#ff6f69" opacity=".2" />
    <path d="M330 60 l8 16 18 3 -13 12 3 18 -16 -9 -16 9 3 -18 -13 -12 18 -3z" fill="#ffc93c" opacity=".5" />
    <path d="M40 360 l6 12 13 2 -10 9 3 13 -12 -7 -12 7 3 -13 -10 -9 13 -2z" fill="#9b6bff" opacity=".35" />
  </svg>

  <header class="topbar">
    <div class="right">
    <a class="icon-btn" id="home-btn" href="../" aria-label="Pagina principale: tutti i giochi">
      <svg viewBox="0 0 24 24"><path d="M3 11 12 3l9 8v10h-6v-6H9v6H3z" fill="currentColor" /></svg>
    </a>
    <button id="player" class="icon-btn player" aria-label="Cambia giocatore" hidden></button>
    </div>
    <div id="level" class="level" hidden><span><span class="lvl-word">Livello </span><b>1</b></span><span class="lvl-stars" aria-label="Stelle per il prossimo livello"><svg viewBox="0 0 24 24"><path d="M12 2l3 6.5 7 .8-5.2 4.8 1.4 7L12 17.6 5.8 21.1l1.4-7L2 9.3l7-.8z" fill="#ffc93c" stroke="#d9a51f" stroke-width="1.2" stroke-linejoin="round"/></svg><i id="stars-n">0</i>/<i id="stars-of">5</i></span></div>
    <div class="right">
    <button id="table-btn" class="icon-btn" aria-label="Come vanno le tabelline e quali ripassare" hidden>
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="8" height="8" rx="2" fill="#3ec5a3"/><rect x="13" y="3" width="8" height="8" rx="2" fill="#ffe066"/><rect x="3" y="13" width="8" height="8" rx="2" fill="#ffa94d"/><rect x="13" y="13" width="8" height="8" rx="2" fill="#9be8cf"/></svg>
    </button>
    <button id="album-btn" class="icon-btn" aria-label="Collezione di sorprese" hidden>
      <svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="3" fill="#9b6bff"/><path d="M12 7.5l1.4 2.9 3.1.4-2.3 2.1.6 3.1L12 14.5 9.2 16l.6-3.1-2.3-2.1 3.1-.4z" fill="#ffc93c"/></svg>
      <span id="album-new" class="dot" hidden></span>
    </button>
    <button id="mute" class="icon-btn" aria-label="Voce accesa/spenta">
      <svg viewBox="0 0 24 24">
        <path d="M3 9h4l5-4v14l-5-4H3z" fill="currentColor" />
        <path class="waves" d="M15.5 8.5a5 5 0 0 1 0 7M18 6a8.5 8.5 0 0 1 0 12" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" />
        <path class="cross" d="M16 9l6 6M22 9l-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
      </svg>
    </button>
    </div>
  </header>

  <main>
    <div class="mascot-wrap">
    <div id="bubble" class="bubble" hidden></div>
    <svg id="mascot" class="mascot" viewBox="0 0 120 110" aria-hidden="true"><g stroke="#3b2f5c" stroke-width="3" stroke-linejoin="round">
<path d="M40 36 Q26 26 24 16 Q36 14 50 30 Z" fill="#fff"/>
<path d="M26 36 Q4 60 18 96 Q30 80 30 66 Q22 88 40 100 Q40 70 46 50 Z" fill="#c9b2ff"/>
<path d="M30 40 Q14 64 26 90 Q36 70 42 56 Z" fill="#ffb3c7"/>
<path d="M80 36 Q94 26 96 16 Q84 14 70 30 Z" fill="#fff"/>
<ellipse cx="62" cy="62" rx="36" ry="36" fill="#fff"/>
<path d="M52 30 L60 1 L68 30 Z" fill="#ffd56b"/>
<path d="M30 40 Q44 18 70 30 Q58 34 50 46 Q44 38 30 40 Z" fill="#9fd3ff"/>
</g>
<path d="M82 31 Q90 25 91 20 Q84 20 77 28 Z" fill="#ffb3c7"/><path d="M38 31 Q30 25 29 20 Q36 20 43 28 Z" fill="#ffb3c7"/>
<path d="M55.5 21 L65.5 18 M57.5 12 L63 10.5" stroke="#e0a92a" stroke-width="2.5" stroke-linecap="round"/>
<g transform="translate(2 0)">
        <g class="eyes-open"><ellipse cx="45" cy="58" rx="7" ry="8.5" fill="#3b2f5c"/><ellipse cx="75" cy="58" rx="7" ry="8.5" fill="#3b2f5c"/>
<circle cx="47.5" cy="54.5" r="2.8" fill="#fff"/><circle cx="77.5" cy="54.5" r="2.8" fill="#fff"/></g>
        <g class="eyes-happy" stroke="#3b2f5c" stroke-width="4" fill="none" stroke-linecap="round"><path d="M37 60 q8 -10 16 0"/><path d="M67 60 q8 -10 16 0"/></g>
        <g class="brows" stroke="#3b2f5c" stroke-width="3.5" stroke-linecap="round"><path d="M36 49 L51 44"/><path d="M84 49 L69 44"/></g>
        <ellipse cx="60" cy="83" rx="15" ry="10" fill="#ffe0ea"/><path d="M53 87 q7 6 14 0" stroke="#3b2f5c" stroke-width="2.5" fill="none" stroke-linecap="round"/><circle cx="31" cy="72" r="5.5" fill="#ff8fa3" opacity=".55"/><circle cx="89" cy="72" r="5.5" fill="#ff8fa3" opacity=".55"/>
      </g>
<path d="M98 76 l2 5 5 2 -5 2 -2 5 -2 -5 -5 -2 5 -2z" fill="#ffd56b"/></svg>
    </div>

    <section id="start" class="card start">
      <h1>Tabelline!</h1>
      <p>Chi gioca?</p>
      <div id="profiles"></div>
    </section>

    <section id="game" class="game" hidden>
      <div class="progress">
        <div id="misses" class="row small" aria-label="Vite"></div>
        <div id="chosen" class="chosen" hidden></div>
      </div>
      <div id="card" class="card question">
        <div class="expr"><span id="qa">3</span> × <span id="qb">4</span> =</div>
        <div id="answer" class="answer"></div>
        <button id="repeat" class="repeat" aria-label="Ripeti la domanda">
          <svg viewBox="0 0 24 24"><path d="M3 9h4l5-4v14l-5-4H3z" fill="currentColor" /><path d="M15.5 8.5a5 5 0 0 1 0 7" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" /></svg>
        </button>
      </div>
      <div id="keypad" class="keypad"></div>
      <div id="choices" class="choices" hidden></div>
    </section>
  </main>

  <div id="banner" class="banner" hidden></div>

  <section id="album" class="album" hidden>
    <div class="album-card">
      <button id="album-close" class="icon-btn close" aria-label="Chiudi">
        <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg>
      </button>
      <h2>Le tue sorprese</h2>
      <div id="album-next" class="album-next"></div>
      <div id="album-grid" class="album-grid"></div>
    </div>
  </section>
  <section id="mastery" class="album" hidden>
    <div class="album-card">
      <button id="mastery-close" class="icon-btn close" aria-label="Chiudi">
        <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg>
      </button>
      <h2>Come vanno le tabelline</h2>
      <h3 class="pick-title">Quali tabelline ripassare?</h3>
      <div id="pick-grid" class="pick-grid"></div>
      <div class="m-fit"><div id="mastery-grid" class="m-grid"></div></div>
      <div id="mastery-legend" class="m-legend"></div>
    </div>
  </section>

  <div id="confetti" class="confetti" aria-hidden="true"></div>

  <div id="dj-slot"></div>
</body>
</html>
