  <!-- Le pagine vivono dentro la cornice (index.html), che tiene audio e schermo intero
       tra una pagina e l'altra: aperte da sole, ci rientrano con lo stesso indirizzo. -->
  <script>if (window.top === window) location.replace('/?go=' + encodeURIComponent(location.pathname + location.search + location.hash));</script>

  <!-- Una pagina vecchia rimasta nella cache può chiedere file che con l'aggiornamento non ci sono
       più (pagina senza stile): in quel caso si ricarica una volta da capo. -->
  <script>addEventListener('error', function (e) { var t = e.target; if (t && (t.tagName === 'LINK' || t.tagName === 'SCRIPT')) { try { if (sessionStorage.getItem('stale') !== location.pathname) { sessionStorage.setItem('stale', location.pathname); location.reload(); } } catch (x) {} } }, true);</script>
